<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Practice Quizzes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1c2230;--muted:#5d6678;--line:#dfe3ea;--accent:#2f5bd3;--accent-soft:#e8eefc}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:40px 20px 60px}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 28px}
  .quiz{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;text-decoration:none;color:inherit;transition:border-color .15s,box-shadow .15s}
  .quiz:hover{border-color:#9fb2e8;box-shadow:0 4px 14px rgba(47,91,211,.08)}
  .quiz:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .num{flex:0 0 auto;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:10px;padding:8px 12px;font-size:15px}
  .info{flex:1;min-width:0}
  .info b{display:block;font-size:17px}
  .info span{color:var(--muted);font-size:14px}
  .go{color:var(--accent);font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<main>
  <h1>Physics Practice Quizzes</h1>
  <p class="sub">Choose a quiz to study. You can reset each quiz and practice as many times as you like.</p>

  <a class="quiz" href="circular-motion-2-9.html">
    <span class="num">2.9</span>
    <span class="info"><b>Circular Motion: MCQ Practice</b><span>AP Physics 1 · 22 questions</span></span>
    <span class="go">Start →</span>
  </a>
</main>
</body>
</html>
